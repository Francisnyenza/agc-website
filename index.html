        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, im);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        texs[name] = t; res();
      };
      im.onerror = rej; im.src = SRC[name];
    });
  }
  function resize() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    if (gl) gl.viewport(0, 0, canvas.width, canvas.height);
    if (birdOK) { bird.size(W, H, dpr); star.size(W, H, dpr); }
  }
  function draw(tex, alpha, fn) {
    if (alpha <= 0) return;
    var i = 0, o = [0, 0];
    for (var y = 0; y <= GRID; y++) for (var x = 0; x <= GRID; x++) {
      fn(x / GRID, y / GRID, o);
      pos[i++] = o[0] / (W / 2); pos[i++] = -o[1] / (H / 2);
    }
    gl.bufferData(gl.ARRAY_BUFFER, pos, gl.DYNAMIC_DRAW);
    gl.bindTexture(gl.TEXTURE_2D, texs[tex]);
    gl.uniform1f(uAlpha, alpha);
    gl.drawElements(gl.TRIANGLES, idxCount, gl.UNSIGNED_SHORT, 0);
  }
  function render(t) {
    var S = Math.min(.78 * W, .60 * H), LH = S * 1024 / 960;
    gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);

    // Bars grow up from their base, one after the other
    draw('bars', ss(T_BARS, T_BARS + .08, t), function (u, v, o) {
      var g = out3((t - T_BARS - (u > .745 ? .12 : 0)) / .55), v0 = .615;
      o[0] = (u - .5) * S; o[1] = ((v - v0) * g + v0 - .5) * LH;
    });

    // Book: starts closed on its spine and opens page by page, the outer edge trailing the fold
    var rise = (1 - ss(T_BOOK - .05, T_BOOK + 1, t)) * .14 * LH;
    function page(t0) {
      return function (u, v, o) {
        var spine = (513 - (v * 1024 - 735) * 35 / 233) / 960, d = u - spine, ad = Math.abs(d), since = t - t0;
        var open = out3((since - .35 * ad) / .85), th = rad(88) * (1 - open);
        if (since > 0 && since < 1.8) th += rad(4) * Math.sin(14 * ad - 12 * since) * Math.exp(-3 * since) * ad * 2 * ss(.3, .7, open);
        var p = 1 / (1 - ad * Math.sin(th) / 2.6);
        o[0] = (spine - .5 + d * Math.cos(th)) * S * p;
        o[1] = ((v - .72) * p + .22) * LH + rise;
      };
    }
    function pair(l, r, t0, alpha) { var f = page(t0), a = alpha * ss(t0 + .04, t0 + .3, t); draw(l, a, f); draw(r, a, f); }
    pair('coverL', 'coverR', T_BOOK, 1);
    // A loose leaf turns just behind each page and comes to rest on it
    pair('blueL', 'blueR', T_BOOK + .3, .5 * (1 - ss(T_BOOK + 1, T_BOOK + 1.3, t)));
    pair('blueL', 'blueR', T_BOOK + .15, 1);
    pair('goldL', 'goldR', T_BOOK + .45, .5 * (1 - ss(T_BOOK + 1.15, T_BOOK + 1.45, t)));
    pair('goldL', 'goldR', T_BOOK + .3, 1);

    // The name: each letter rises out of the fold of the book and travels to its place, from the centre outward
    if (t > T_WORDS) {
      for (var i = 0; i < META.letters.length; i++) (function (m) {
        var cx = m[0] + m[2] / 2, cy = m[1] + m[3] / 2, x = (t - T_WORDS - .55 * Math.abs(cx - .53) / .47) / .55;
        if (x <= 0) return;
        var e = out3(x), sc = lerp(.25, 1, e), rot = lerp((cx < .53 ? -1 : 1) * .6, 0, e);
        var px = lerp(.533 - .5, cx - .5, e) * S, py = lerp(.66 - .5, cy - .5, e) * LH - Math.sin(PI * e) * .07 * LH;
        var c = Math.cos(rot), s = Math.sin(rot), w = m[2] * S * sc, h = m[3] * LH * sc;
        gl.uniform4f(uRect, m[4], m[5], m[6], m[7]);
        draw('letters', ss(0, .25, x), function (u, v, o) {
          var a = (u - .5) * w, b = (v - .5) * h;
          o[0] = px + a * c - b * s; o[1] = py + a * s + b * c;
        });
      })(META.letters[i]);
      gl.uniform4f(uRect, 0, 0, 1, 1);
    }

    // The motto is written by the passing star
    var r = birdOK ? star.reveal(t) : 2;
    if (r > META.u0 - .02) {
      gl.uniform1f(uReveal, r);
      draw('motto', 1, function (u, v, o) { o[0] = (u - .5) * S; o[1] = (v - .5) * LH; });
      gl.uniform1f(uReveal, 2);
    }

    // Sharp logo eagle takes over from the last morph frame, which is the same picture
    draw('eagle', birdOK ? ss(T_MORPH_END - .05, T_MORPH_END + .08, t) : 1, function (u, v, o) { o[0] = (u - .5) * S; o[1] = (v - .5) * LH; });
    if (birdOK) { bird.frame(t, W, H, S, LH); star.frame(t, W, H, S, LH); }
  }

  function finish() {
    if (finished) return;
    finished = true;
    timers.forEach(clearTimeout); cancelAnimationFrame(raf);
    if (gl && Object.keys(texs).length === Object.keys(SRC).length) render(FINAL); else doc.classList.add('nogl');
    doc.classList.remove('intro-on');
    doc.classList.add('done');
    document.removeEventListener('pointerdown', finish);
    document.removeEventListener('keydown', finish);
  }
  function play() {
    if (finished) return;
    var t0 = performance.now();
    (function loop(now) {
      if (finished) return;
      render((now - t0) / 1000);
      raf = requestAnimationFrame(loop);
    })(t0);
    timers.push(setTimeout(finish, FINISH_AT * 1000));
  }

  var calm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  birdOK = !calm && bird.setup() && star.setup();
  resize();
  window.addEventListener('resize', function () { resize(); if (finished && gl && Object.keys(texs).length === Object.keys(SRC).length) render(FINAL); });
  if (calm || !init()) { if (!gl) { doc.classList.add('nogl'); finish(); } else Promise.all(Object.keys(SRC).map(loadTex)).then(finish, finish); return; }
  document.addEventListener('pointerdown', finish);
  document.addEventListener('keydown', finish);
  timers.push(setTimeout(finish, 8000));
  Promise.all(Object.keys(SRC).map(loadTex).concat(birdOK ? [bird.load()] : [])).then(function () {
    timers.forEach(clearTimeout); timers = [];
    play();
  }, finish);
})();
</script>
</body>
